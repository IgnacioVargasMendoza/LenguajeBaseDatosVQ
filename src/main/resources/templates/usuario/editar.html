<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="layout/plantilla :: head">
        <title>Editar Usuario</title>
    </head>
    <body>
        <header th:replace="layout/plantilla :: header"/>
        
        <div class="container mt-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4><i class="fas fa-user"></i> Editar Usuario</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/usuario/actualizar}" method="POST" th:object="${usuario}">
                        <input type="hidden" th:field="*{idUsuario}" />
                        
                        <div class="form-group mb-3">
                            <label for="nombre" class="form-label">Nombre:</label>
                            <input type="text" class="form-control" th:field="*{nombre}" id="nombre" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="primerApellido" class="form-label">Primer Apellido:</label>
                            <input type="text" class="form-control" th:field="*{primerApellido}" id="primerApellido" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="segundoApellido" class="form-label">Segundo Apellido:</label>
                            <input type="text" class="form-control" th:field="*{segundoApellido}" id="segundoApellido" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="correo" class="form-label">Correo Electrónico:</label>
                            <input type="email" class="form-control" th:field="*{correo}" id="correo" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="contrasena" class="form-label">Contraseña:</label>
                            <input type="password" class="form-control" th:field="*{contrasena}" id="contrasena" required>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/usuario/listado}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Actualizar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <footer th:replace="layout/plantilla :: footer"/>
    </body>
</html>
