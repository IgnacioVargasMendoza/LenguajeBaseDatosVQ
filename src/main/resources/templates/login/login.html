<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns="http://www.w3.org/1999/xhtml">
    <head th:replace="~{layout/plantilla :: head}">
        <title>Hospital el Milagro</title>        
    </head>
    <style>
        .login-page {
            background-color: #f8f9fa;
            padding: 50px 0;
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-card {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.3s ease;
            max-width: 450px;
            width: 100%;
            margin: 0 auto;
        }
        
        .login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }
        
        .login-header {
            background-color: #2D304D;
            color: white;
            padding: 20px;
            text-align: center;
            border-bottom: 5px solid #39C9DB;
        }
        
        .login-body {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-control {
            border-radius: 8px;
            padding: 12px 15px;
            border: 1px solid #e1e1e1;
            width: 100%;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .form-control:focus {
            border-color: #39C9DB;
            box-shadow: 0 0 0 0.2rem rgba(57, 201, 219, 0.25);
        }
        
        .input-icon {
            color: #2D304D;
            margin-right: 10px;
            font-size: 18px;
        }
        
        .form-label {
            font-weight: 600;
            color: #2D304D;
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }
        
        .btn-login {
            background-color: #39C9DB;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
            margin-bottom: 15px;
        }
        
        .btn-login:hover {
            background-color: #2bb6c7;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(57, 201, 219, 0.3);
        }
        
        .btn-register {
            background-color: #F9589B;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s;
        }
        
        .btn-register:hover {
            background-color: #e54989;
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(249, 88, 155, 0.3);
        }
        
        .login-error {
            background-color: #fff2f4;
            border-left: 4px solid #F9589B;
            color: #d63384;
            padding: 15px;
            margin-top: 25px;
            border-radius: 6px;
        }
    </style>
    <body>
        <header th:replace="~{layout/plantilla :: header}"/>
        
        <div class="login-page">
            <div class="container">
                <div class="login-card">
                    <div class="login-header">
                        <h2>[[#{login.login}]]</h2>
                        <p class="mb-0">Accede a tu cuenta para gestionar tus citas médicas</p>
                    </div>
                    
                    <div class="login-body">
                        <form method="POST" th:action="@{/login}">
                            <div class="form-group">
                                <label class="form-label" for="nombre">
                                    <i class="fas fa-user-lock input-icon"></i>
                                    [[#{usuario.nombre}]]
                                </label>
                                <input class="form-control" type="text" name="nombre" id="nombre" placeholder="Ingresa tu nombre de usuario" required />
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">
                                    <i class="fas fa-key input-icon"></i>
                                    [[#{login.password}]]
                                </label>
                                <input class="form-control" type="password" name="password" id="password" placeholder="Ingresa tu contraseña" required />
                            </div>

                            <div class="form-group mb-0">
                                <button type="submit" class="btn btn-login">
                                    <i class="fas fa-sign-in-alt"></i> Iniciar Sesión
                                </button>
                                
                                <a class="btn btn-register" th:href="@{/registro/nuevo}" role="button">
                                    <i class="fas fa-user-plus"></i> [[#{accion.registrar}]]
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
                
                <div th:if="${param.error != null}" class="login-error text-center mx-auto" style="max-width: 450px;">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    <p class="mb-0">Error: Credenciales inválidas. Por favor, intente nuevamente.</p>
                </div>
            </div>
        </div>
                   
        <footer th:replace="~{layout/plantilla :: footer}"/>          
    </body>
</html>
