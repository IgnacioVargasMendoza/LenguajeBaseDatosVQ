<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="layout/plantilla :: head">
        <title>Editar Doctor</title>
    </head>
    <body>
        <header th:replace="layout/plantilla :: header"/>
        
        <div class="container mt-4">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4><i class="fas fa-user-md"></i> Editar Doctor</h4>
                </div>
                <div class="card-body">
                    <form th:action="@{/doctor/actualizar}" method="POST" th:object="${doctor}">
                        <input type="hidden" th:field="*{idDoctor}" />
                        
                        <div class="form-group mb-3">
                            <label for="idUsuario" class="form-label">Usuario:</label>
                            <select class="form-select" th:field="*{idUsuario}" id="idUsuario" required>
                                <option value="">Seleccione un usuario</option>
                                <option th:each="usuario : ${listaUsuarios}" 
                                        th:value="${usuario.idUsuario}" 
                                        th:text="${usuario.nombre + ' ' + usuario.apellido}"></option>
                            </select>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="telefono" class="form-label">Teléfono:</label>
                            <input type="text" class="form-control" th:field="*{telefono}" id="telefono" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="numLicencia" class="form-label">Número de Licencia:</label>
                            <input type="text" class="form-control" th:field="*{numLicencia}" id="numLicencia" required>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="idDireccion" class="form-label">Dirección:</label>
                            <select class="form-select" th:field="*{idDireccion}" id="idDireccion" required>
                                <option value="">Seleccione una dirección</option>
                                <option th:each="direccion : ${listaDirecciones}" 
                                        th:value="${direccion.idDireccion}" 
                                        th:text="${direccion.nombreDireccion}"></option>
                            </select>
                        </div>
                        
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/doctor/listado}" class="btn btn-secondary">
                                <i class="fas fa-arrow-left"></i> Volver
                            </a>
                            <button type="submit" class="btn btn-success">
                                <i class="fas fa-save"></i> Actualizar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <footer th:replace="layout/plantilla :: footer"/>
    </body>
</html>
